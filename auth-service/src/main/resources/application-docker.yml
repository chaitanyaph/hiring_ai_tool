spring:
  datasource:
    url: jdbc:mysql://auth-db:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
  data:
    redis:
      host: redis
  kafka:
    bootstrap-servers: kafka:9092
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka
app:
  jwt:
    secret: ${JWT_SECRET}
