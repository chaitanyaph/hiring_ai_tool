services:
  analytics-db:
    image: mysql:8.0
    container_name: cadence-analytics-db
    environment:
      MYSQL_DATABASE: analytics_db
      MYSQL_USER: analytics_user
      MYSQL_PASSWORD: analytics_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3318:3306"
    volumes:
      - analytics_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "analytics_user", "-panalytics_pass"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [cadence-net]

  redis:
    image: redis:7-alpine
    container_name: cadence-analytics-redis
    ports:
      - "6391:6379"
    networks: [cadence-net]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: cadence-analytics-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks: [cadence-net]

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: cadence-analytics-kafka
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9104:9092"
    networks: [cadence-net]

  eureka-server:
    image: steeltoeoss/eureka-server:latest
    container_name: cadence-analytics-eureka
    ports:
      - "8773:8761"
    networks: [cadence-net]

  analytics-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cadence-analytics-service
    depends_on:
      analytics-db:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: analytics_user
      DB_PASSWORD: analytics_pass
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URI: http://eureka:eureka_pass@eureka-server:8761/eureka
      JWT_SECRET: c2FtcGxlLXNlY3JldC1rZXktY2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tZW52aXJvbm1lbnQtMzItYnl0ZXMh
    ports:
      - "8094:8094"
    networks: [cadence-net]

networks:
  cadence-net:
    driver: bridge

volumes:
  analytics_db_data:
