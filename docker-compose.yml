# Originally sized for a tight free-tier VM (e.g. Oracle Cloud "Always Free" ARM
# Ampere, 2 OCPU / 12GB RAM -- see DEPLOYMENT.md). If you're running on a larger
# box (this deployment: a 4 vCPU / 16GB GCP VM), these limits have real headroom
# to grow -- see the mem_limit comment below for why they were bumped up from the
# original tighter values. SerialGC is still forced since none of these services
# see enough traffic to benefit from a concurrent collector, and its footprint is
# smaller regardless of box size. Redpanda replaces Kafka+Zookeeper (Kafka-API-
# compatible, a small fraction of the RAM). Redis is NOT self-hosted here -- every
# service points at a free managed Upstash Redis database instead (REDIS_HOST/
# PASSWORD in .env). Judge0 (code execution sandbox for coding-assessment-service)
# is intentionally NOT included here -- see DEPLOYMENT.md's "Judge0" section.

# -XX:MaxMetaspaceSize=96m was too tight for a Spring Boot 3 app with Hibernate +
# Jackson + Spring Security + the Eureka client all loaded -- every service that
# reached full startup was crashing with "OutOfMemoryError: Metaspace" a few
# seconds after registering with Eureka. 224m gives real headroom without being
# wasteful; Xmx bumped alongside it since 256m of heap was also tight under real
# request load, not just at startup. Every per-service mem_limit below was raised
# to 768m to match -- Docker's hard cap has to sit comfortably above Xmx+Metaspace
# (320m+224m=544m) plus thread stacks/JIT code cache/direct buffers/native
# overhead, or Docker's own OOM-killer replaces the JVM's Metaspace crash with a
# silent container kill instead.
x-jvm-small: &jvm-small
  JAVA_OPTS: "-Xms96m -Xmx320m -XX:MaxMetaspaceSize=224m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss256k"

x-service-common: &service-common
  DB_USERNAME: root
  DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
  # Managed Upstash Redis (replaces a self-hosted container -- see DEPLOYMENT.md's
  # "Upstash Redis" section). Requires TLS, hence REDIS_SSL_ENABLED.
  REDIS_HOST: ${REDIS_HOST}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDIS_SSL_ENABLED: ${REDIS_SSL_ENABLED:-true}
  KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  EUREKA_URI: http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@eureka-server:8761/eureka
  JWT_SECRET: ${JWT_SECRET}

networks:
  cadence-net:
    driver: bridge

volumes:
  mysql-data:
  redpanda-data:
  minio-data:
  caddy-data:
  caddy-config:

services:
  # ---------------- Reverse proxy / TLS termination ----------------
  # The only container with 80/443 published. Vercel always serves the frontend over
  # HTTPS, and browsers block a HTTPS page calling a plain-HTTP API ("mixed content"),
  # so this is not optional for the Vercel+VM combination to work at all -- see
  # DEPLOYMENT.md's "HTTPS is mandatory" section. Caddy issues/renews the Let's
  # Encrypt certificate for CADDY_DOMAIN automatically on first boot.

  caddy:
    image: caddy:2-alpine
    container_name: cadence-caddy
    restart: unless-stopped
    mem_limit: 128m
    depends_on: [api-gateway-service]
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
    networks: [cadence-net]

  # ---------------- Infrastructure ----------------

  mysql:
    image: mysql:8.0
    container_name: cadence-mysql
    restart: unless-stopped
    mem_limit: 640m
    command: >
      --innodb-buffer-pool-size=256M
      --max-connections=200
      --performance-schema=OFF
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    networks: [cadence-net]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: cadence-redpanda
    restart: unless-stopped
    mem_limit: 768m
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:9092
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks: [cadence-net]

  minio:
    image: minio/minio:latest
    container_name: cadence-minio
    restart: unless-stopped
    mem_limit: 160m
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks: [cadence-net]

  eureka-server:
    build: ./eureka-server
    container_name: cadence-eureka
    restart: unless-stopped
    mem_limit: 768m
    environment:
      <<: *jvm-small
      EUREKA_USERNAME: ${EUREKA_USERNAME}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD}
    ports:
      - "8761:8761"
    networks: [cadence-net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ---------------- API Gateway (the single public entry point) ----------------

  api-gateway-service:
    build: ./api-gateway-service
    container_name: cadence-gateway
    restart: unless-stopped
    mem_limit: 768m
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
      <<: *jvm-small
      EUREKA_URI: http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@eureka-server:8761/eureka
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_SSL_ENABLED: ${REDIS_SSL_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    ports:
      - "8080:8080"
    networks: [cadence-net]

  # ---------------- Business services ----------------

  auth-service:
    build: ./auth-service
    restart: unless-stopped
    mem_limit: 768m
    depends_on:
      mysql: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
    environment:
      <<: [*jvm-small, *service-common]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    ports: ["8081:8081"]
    networks: [cadence-net]

  company-service:
    build: ./company-service
    restart: unless-stopped
    mem_limit: 768m
    depends_on:
      mysql: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
    environment:
      <<: [*jvm-small, *service-common]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/company_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    ports: ["8083:8083"]
    networks: [cadence-net]

  job-service:
    build: ./job-service
    restart: unless-stopped
    mem_limit: 768m
    depends_on:
      mysql: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
    environment:
      <<: [*jvm-small, *service-common]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/job_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    ports: ["8084:8084"]
    networks: [cadence-net]

  candidate-service:
    build: ./candidate-service
    restart: unless-stopped
    mem_limit: 768m
    depends_on:
      mysql: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
    environment:
      <<: [*jvm-small, *service-common]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/candidate_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    ports: ["8085:8085"]
    networks: [cadence-net]

  resume-service:
    build: ./resume-service
    restart: unless-stopped
    mem_limit: 768m
    depends_on:
      mysql: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      minio: { condition: service_started }
    environment:
      <<: [*jvm-small, *service-common]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/resume_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    ports: ["8087:8087"]
    networks: [cadence-net]

  application-service:
    build: ./application-service
    restart: unless-stopped
    mem_limit: 768m
    depends_on:
      mysql: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
    environment:
      <<: [*jvm-small, *service-common]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/application_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    ports: ["8086:8086"]
    networks: [cadence-net]

  resume-parser-service:
    build: ./resume-parser-service
    restart: unless-stopped
    mem_limit: 768m
    depends_on:
      mysql: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
    environment:
      <<: [*jvm-small, *service-common]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/resume_parser_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      RESUME_PARSER_PROVIDER: ${RESUME_PARSER_PROVIDER}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      GROQ_API_KEY: ${GROQ_API_KEY}
    ports: ["8088:8088"]
    networks: [cadence-net]

  ai-interview-service:
    build: ./ai-interview-service
    restart: unless-stopped
    mem_limit: 768m
    depends_on:
      mysql: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
    environment:
      <<: [*jvm-small, *service-common]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ai_interview_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      AI_INTERVIEW_PROVIDER: ${AI_INTERVIEW_PROVIDER}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      GROQ_API_KEY: ${GROQ_API_KEY}
    ports: ["8089:8089"]
    networks: [cadence-net]

  coding-assessment-service:
    build: ./coding-assessment-service
    restart: unless-stopped
    mem_limit: 768m
    depends_on:
      mysql: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
    environment:
      <<: [*jvm-small, *service-common]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/coding_assessment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      CODING_ASSESSMENT_AI_PROVIDER: ${CODING_ASSESSMENT_AI_PROVIDER}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      GROQ_API_KEY: ${GROQ_API_KEY}
      JUDGE0_BASE_URL: ${JUDGE0_BASE_URL}
    ports: ["8090:8090"]
    networks: [cadence-net]

  interview-management-service:
    build: ./interview-management-service
    restart: unless-stopped
    mem_limit: 768m
    depends_on:
      mysql: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
    environment:
      <<: [*jvm-small, *service-common]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/interview_management_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    ports: ["8091:8091"]
    networks: [cadence-net]

  notification-service:
    build: ./notification-service
    restart: unless-stopped
    mem_limit: 768m
    depends_on:
      mysql: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
    environment:
      <<: [*jvm-small, *service-common]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/notification_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    ports: ["8092:8092"]
    networks: [cadence-net]

  offer-management-service:
    build: ./offer-management-service
    restart: unless-stopped
    mem_limit: 768m
    depends_on:
      mysql: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
    environment:
      <<: [*jvm-small, *service-common]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/offer_management_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    ports: ["8093:8093"]
    networks: [cadence-net]

  analytics-service:
    build: ./analytics-service
    restart: unless-stopped
    mem_limit: 768m
    depends_on:
      mysql: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
    environment:
      <<: [*jvm-small, *service-common]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/analytics_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    ports: ["8094:8094"]
    networks: [cadence-net]
