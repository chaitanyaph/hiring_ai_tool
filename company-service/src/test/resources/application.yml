spring:
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  kafka:
    bootstrap-servers: localhost:9092
  jpa:
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: CHAR
  autoconfigure:
    exclude:
      - org.springframework.cloud.netflix.eureka.EurekaClientAutoConfiguration
eureka:
  client:
    enabled: false
