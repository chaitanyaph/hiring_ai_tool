server:
  port: 8089
  error:
    include-message: always
    include-binding-errors: always

cadence:
  frontend-base-url: ${FRONTEND_BASE_URL:https://hirepilot.duckdns.org}

spring:
  application:
    name: ai-interview-service

  config:
    import: optional:configserver:http://localhost:8888

  cloud:
    config:
      fail-fast: false

  datasource:
    url: jdbc:mysql://localhost:3306/ai_interview_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 20
        type:
          preferred_uuid_jdbc_type: CHAR
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ai-interview-service-group
      auto-offset-reset: earliest

# Same shared secret as auth-service -- AI Interview Service validates tokens
# Auth Service issued, it never issues its own.
app:
  jwt:
    secret: ${JWT_SECRET:c2FtcGxlLXNlY3JldC1rZXktY2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tZW52aXJvbm1lbnQtMzItYnl0ZXMh}

ai-interview:
  idempotency:
    lock-ttl-seconds: 300
  session:
    default-question-count: 8
    default-duration-minutes: 20
    ttl-hours: 72
  shortlisting:
    auto-shortlist-min-score: 70
    auto-reject-max-score: 59
  ai:
    provider: ${AI_INTERVIEW_PROVIDER:gemini} # gemini | groq | ollama
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.0-flash}
      base-url: https://generativelanguage.googleapis.com/v1beta
      timeout-seconds: 30
    groq:
      api-key: ${GROQ_API_KEY:}
      model: ${GROQ_MODEL:llama-3.3-70b-versatile}
      base-url: https://api.groq.com/openai/v1
      timeout-seconds: 30
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:llama3.1}
      timeout-seconds: 60

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_URI:http://eureka:eureka_pass@localhost:8761/eureka}
    fetch-registry: true
    register-with-eureka: true
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.cadence.aiinterviewservice: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
