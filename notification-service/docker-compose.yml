services:
  notification-db:
    image: mysql:8.0
    container_name: cadence-notification-db
    environment:
      MYSQL_DATABASE: notification_db
      MYSQL_USER: notification_user
      MYSQL_PASSWORD: notification_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3316:3306"
    volumes:
      - notification_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "notification_user", "-pnotification_pass"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [cadence-net]

  redis:
    image: redis:7-alpine
    container_name: cadence-notification-redis
    ports:
      - "6389:6379"
    networks: [cadence-net]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: cadence-notification-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks: [cadence-net]

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: cadence-notification-kafka
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9102:9092"
    networks: [cadence-net]

  eureka-server:
    image: steeltoeoss/eureka-server:latest
    container_name: cadence-notification-eureka
    ports:
      - "8771:8761"
    networks: [cadence-net]

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cadence-notification-service
    depends_on:
      notification-db:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: notification_user
      DB_PASSWORD: notification_pass
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URI: http://eureka:eureka_pass@eureka-server:8761/eureka
      JWT_SECRET: c2FtcGxlLXNlY3JldC1rZXktY2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tZW52aXJvbm1lbnQtMzItYnl0ZXMh
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-no-reply@cadence-hiring.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Cadence Hiring Platform}
    ports:
      - "8092:8092"
    networks: [cadence-net]

networks:
  cadence-net:
    driver: bridge

volumes:
  notification_db_data:
