name: CI/CD

# Build + test every backend service and the Angular app on every push/PR.
# Deploy only runs on a push to master, and only after every build-and-test job
# passes. Deploy re-builds Docker images directly on the VM via `docker compose
# up -d --build` (the same command DEPLOYMENT.md's manual steps use) rather than
# pushing to a separate container registry first -- docker-compose.yml already
# builds each service `build: ./service-name` from source, so building a second
# time in CI just to push images nobody references would burn free CI minutes
# for no benefit and require a registry-based rewrite of docker-compose.yml that
# isn't otherwise needed. The Angular frontend has no such build-on-VM path (no
# Node on the VM), so its production build is rsynced in directly instead.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test-backend:
    name: Build & test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - eureka-server
          - api-gateway-service
          - auth-service
          - company-service
          - job-service
          - candidate-service
          - resume-service
          - application-service
          - resume-parser-service
          - ai-interview-service
          - coding-assessment-service
          - interview-management-service
          - notification-service
          - offer-management-service
          - analytics-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: mvn verify
        working-directory: ${{ matrix.service }}
        run: mvn -B -ntp clean verify

      - name: Validate Dockerfile builds
        working-directory: ${{ matrix.service }}
        run: docker build -t cadence-${{ matrix.service }}:ci .

  build-and-test-frontend:
    name: Build Angular (production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          # Angular CLI 22 requires Node >=22.22.3/24.15.0/26.0.0 -- Node 20
          # (the runner's previous pin) fails ng build's own version check.
          node-version: '24'
          cache: npm
          cache-dependency-path: cadence_angular/package-lock.json

      - name: npm install
        working-directory: cadence_angular
        # package-lock.json is generated on Windows dev machines and only records
        # the win32 rollup/esbuild native binaries as resolved -- npm (both `ci`
        # and plain `install`) treats an existing lockfile's platform-specific
        # optionalDependency resolutions as authoritative rather than
        # re-resolving them per OS, so either command hard-fails on Linux with
        # EBADPLATFORM instead of just installing the linux-x64 variant. Dropping
        # the lockfile here forces a fresh resolve against the registry, which
        # correctly picks the platform-matching binaries.
        run: rm -f package-lock.json && npm install

      - name: Production build
        working-directory: cadence_angular
        run: npm run build -- --configuration production

  deploy:
    name: Deploy to VM
    needs: [build-and-test-backend, build-and-test-frontend]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cadence_angular/package-lock.json

      - name: npm install
        working-directory: cadence_angular
        # package-lock.json is generated on Windows dev machines and only records
        # the win32 rollup/esbuild native binaries as resolved -- npm (both `ci`
        # and plain `install`) treats an existing lockfile's platform-specific
        # optionalDependency resolutions as authoritative rather than
        # re-resolving them per OS, so either command hard-fails on Linux with
        # EBADPLATFORM instead of just installing the linux-x64 variant. Dropping
        # the lockfile here forces a fresh resolve against the registry, which
        # correctly picks the platform-matching binaries.
        run: rm -f package-lock.json && npm install

      - name: Production build
        working-directory: cadence_angular
        run: npm run build -- --configuration production

      # The VM has no Node install -- frontend-dist is static files served
      # directly by Caddy (see docker-compose.yml's caddy volume mount), so
      # the build output is synced in from here instead of being built on
      # the VM. rsync writes into the existing frontend-dist directory
      # rather than replacing it, because Caddy's bind mount is pinned to
      # that directory's identity at container-start time -- swapping the
      # directory itself (rather than its contents) orphans the mount and
      # serves an empty root until the container is recreated.
      - name: Sync frontend build to VM
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: cadence_angular/dist/cadence-angular/browser/
          remote_path: ~/cadence/frontend-dist/
          remote_host: ${{ secrets.VM_HOST }}
          remote_user: ${{ secrets.VM_USER }}
          remote_key: ${{ secrets.VM_SSH_KEY }}

      - name: Deploy backend (git pull + docker compose up -d --build)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd ~/cadence
            git pull origin master
            docker compose up -d --build
            docker image prune -f
