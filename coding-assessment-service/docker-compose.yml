services:
  codingassessment-db:
    image: mysql:8.0
    container_name: cadence-codingassessment-db
    environment:
      MYSQL_DATABASE: coding_assessment_db
      MYSQL_USER: codingassessment_user
      MYSQL_PASSWORD: codingassessment_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3314:3306"
    volumes:
      - codingassessment_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "codingassessment_user", "-pcodingassessment_pass"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [cadence-net]

  redis:
    image: redis:7-alpine
    container_name: cadence-codingassessment-redis
    ports:
      - "6387:6379"
    networks: [cadence-net]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: cadence-codingassessment-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks: [cadence-net]

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: cadence-codingassessment-kafka
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9100:9092"
    networks: [cadence-net]

  eureka-server:
    image: steeltoeoss/eureka-server:latest
    container_name: cadence-codingassessment-eureka
    ports:
      - "8769:8761"
    networks: [cadence-net]

  coding-assessment-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cadence-coding-assessment-service
    depends_on:
      codingassessment-db:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: codingassessment_user
      DB_PASSWORD: codingassessment_pass
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URI: http://eureka:eureka_pass@eureka-server:8761/eureka
      JWT_SECRET: c2FtcGxlLXNlY3JldC1rZXktY2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tZW52aXJvbm1lbnQtMzItYnl0ZXMh
      # Judge0 is NOT started by this compose file -- see README "Code
      # Execution Backend (Judge0)" for why (its own multi-container
      # stack needs privileged cgroup access for real sandboxing, so
      # faking a minimal version here would be actively misleading).
      # Point this at a separately-run Judge0 CE stack or a RapidAPI key.
      JUDGE0_BASE_URL: ${JUDGE0_BASE_URL:-http://host.docker.internal:2358}
      JUDGE0_API_KEY: ${JUDGE0_API_KEY:-}
      CODING_ASSESSMENT_AI_PROVIDER: ${CODING_ASSESSMENT_AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    ports:
      - "8090:8090"
    networks: [cadence-net]

networks:
  cadence-net:
    driver: bridge

volumes:
  codingassessment_db_data:
